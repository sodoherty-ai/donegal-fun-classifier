<div id="funclassify">
  <div class="fc-photo">
    <img src="https://sodoherty.ai/wp-content/uploads/2026/09/donegal_animals_model.png"
         alt="A Blackface sheep, a rook, a jackdaw and a Charolais cow in Donegal">
    <div class="fc-box" hidden></div>
  </div>

  <form class="fc-form" autocomplete="off">
    <input type="text" placeholder="Describe one of the animals, then press Enter" aria-label="Describe an animal" disabled>
    <button type="submit" disabled>Classify</button>
  </form>

  <div class="fc-status" role="status">Reading the model hidden in the image…</div>
  <div class="fc-bars" hidden></div>

  <style>
    #funclassify {
      --accent: #2f6b3a;
      --muted: rgba(127, 127, 127, .25);
      --highlight: #ffd400;
      max-width: 1000px;
      margin: 0 auto;

      .fc-photo { position: relative; }
      .fc-photo img { display: block; width: 100%; height: auto; border-radius: 6px; }

      .fc-box {
        position: absolute;
        border: 3px solid var(--highlight);
        border-radius: 6px;
        box-shadow: 0 0 12px rgba(0, 0, 0, .5);
        pointer-events: none;
        transition: all .35s ease;
      }
      .fc-box[hidden] { display: block; opacity: 0; }
      .fc-box::before {
        content: attr(data-label);
        position: absolute;
        left: -3px;
        top: -3px;
        padding: .1em .45em;
        background: var(--highlight);
        color: #111;
        font-size: clamp(10px, 1.6vw, 14px);
        font-weight: 600;
        text-transform: capitalize;
        border-radius: 6px 0;
      }
      .fc-box.fc-label-below::before { top: auto; bottom: -3px; }

      .fc-form { display: flex; gap: .5rem; margin: 1rem 0 .5rem; }
      .fc-form input {
        flex: 1;
        min-width: 0;
        font: inherit;
        padding: .6rem .8rem;
        border: 1px solid var(--muted);
        border-radius: 6px;
        background: transparent;
        color: inherit;
      }
      .fc-form button {
        font: inherit;
        padding: .6rem 1rem;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      .fc-form :disabled { opacity: .5; cursor: default; }

      .fc-status.fc-error { color: #b3261e; }
      .fc-answer { font-size: 1.4em; text-transform: capitalize; }

      .fc-bars {
        display: grid;
        grid-template-columns: max-content 1fr 3.5em;
        gap: .3rem .6rem;
        align-items: center;
        font-size: .9em;
      }
      .fc-bar { height: .6em; border-radius: 3px; background: var(--muted); overflow: hidden; }
      .fc-bar span { display: block; height: 100%; background: var(--accent); }
      .fc-pct { text-align: right; }
    }
  </style>

  <script>
  (async function () {

    async function inflate(bytes) {
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
      return new Uint8Array(await new Response(stream).arrayBuffer());
    }

    function parsePng(data) {
      const view = new DataView(data.buffer);
      if (view.getUint32(0) !== 0x89504e47) throw new Error("Not a PNG image");

      const png = { width: 0, height: 0, compressed: [] };
      for (let pos = 8; pos < data.length; ) {
        const length = view.getUint32(pos);
        const type = String.fromCharCode(...data.subarray(pos + 4, pos + 8));
        const body = data.subarray(pos + 8, pos + 8 + length);
        if (type === "IHDR") {
          png.width = view.getUint32(pos + 8);
          png.height = view.getUint32(pos + 12);
          const [bitDepth, colourType] = body.subarray(8, 10);
          if (bitDepth !== 8 || colourType !== 2) throw new Error("Image has been re-encoded; upload the original PNG");
        }
        if (type === "IDAT") png.compressed.push(body);
        pos += 12 + length;  // length + type + body + CRC
      }
      return png;
    }

    function paeth(left, up, upLeft) {
      const guess = left + up - upLeft;
      const dLeft = Math.abs(guess - left), dUp = Math.abs(guess - up), dUpLeft = Math.abs(guess - upLeft);
      if (dLeft <= Math.min(dUp, dUpLeft)) return left;
      return dUp <= dUpLeft ? up : upLeft;
    }

    function predict(filter, left, up, upLeft) {
      switch (filter) {
        case 1: return left;
        case 2: return up;
        case 3: return Math.floor((left + up) / 2);
        case 4: return paeth(left, up, upLeft);
        default: return 0;
      }
    }

    function unfilter(raw, width, height) {
      const stride = width * 3;
      const pixels = new Uint8Array(stride * height);
      let previous = new Uint8Array(stride);
      for (let y = 0; y < height; y++) {
        const start = y * (stride + 1), filter = raw[start];
        const row = raw.slice(start + 1, start + 1 + stride);
        for (let x = 0; x < stride; x++) {
          const left = x >= 3 ? row[x - 3] : 0;
          const upLeft = x >= 3 ? previous[x - 3] : 0;
          row[x] = (row[x] + predict(filter, left, previous[x], upLeft)) % 256;
        }
        pixels.set(row, y * stride);
        previous = row;
      }
      return pixels;
    }

    function hiddenBytes(pixels, start, count) {
      const bytes = new Uint8Array(count);
      for (let n = 0; n < count; n++) {
        for (let bit = 0; bit < 8; bit++) {
          bytes[n] = bytes[n] * 2 + pixels[(start + n) * 8 + bit] % 2;
        }
      }
      return bytes;
    }

    async function loadModel(url) {
      const data = new Uint8Array(await (await fetch(url)).arrayBuffer());
      const png = parsePng(data);
      const pixels = unfilter(await inflate(new Blob(png.compressed)), png.width, png.height);

      const header = hiddenBytes(pixels, 0, 8);
      if (String.fromCharCode(...header.subarray(0, 4)) !== "FCM1") throw new Error("No model found in this image");
      const length = new DataView(header.buffer).getUint32(4);

      const json = new TextDecoder().decode(await inflate(hiddenBytes(pixels, 8, length)));
      return JSON.parse(json);
    }

    const WORDS = /[\p{L}\p{N}_]+/gu;  // same as Python's \w+

    function makeClassifier(model) {
      const index = new Map(model.vocabulary.map((word, i) => [word, i]));
      const { coef, intercept } = model.model;

      return function classify(text) {
        const words = (text.toLowerCase().match(WORDS) || []).filter(word => index.has(word));
        const scores = coef.map((weights, k) =>
          words.reduce((sum, word) => sum + weights[index.get(word)], intercept[k]));

        const exps = scores.map(Math.exp);
        const total = exps.reduce((a, b) => a + b, 0);
        const probabilities = model.classes
          .map((label, k) => ({ label, p: exps[k] / total }))
          .sort((a, b) => b.p - a.p);
        return { words, probabilities };  // most likely animal first
      };
    }

    const root = document.getElementById("funclassify");
    const img = root.querySelector("img"), form = root.querySelector("form");
    const input = form.querySelector("input"), button = form.querySelector("button");
    const status = root.querySelector(".fc-status"), bars = root.querySelector(".fc-bars");
    const box = root.querySelector(".fc-box");

    function element(tag, className, text) {
      return Object.assign(document.createElement(tag), { className: className || "", textContent: text || "" });
    }

    function setStatus(text, isError) {
      status.textContent = text;
      status.classList.toggle("fc-error", Boolean(isError));
    }

    function highlight(label, region) {
      box.hidden = !region;
      if (!region) return;
      Object.assign(box.style, {
        left: region.x * 100 + "%", top: region.y * 100 + "%",
        width: region.w * 100 + "%", height: region.h * 100 + "%",
      });
      box.dataset.label = label;
      box.classList.toggle("fc-label-below", region.y < 0.05);  // keep the label inside the photo
    }

    function showResult({ words, probabilities }, regions) {
      if (words.length === 0) {
        setStatus("None of those words are in my vocabulary. Try describing colours, sounds or behaviour.");
        bars.hidden = true;
        highlight(null, null);
        return;
      }

      const best = probabilities[0].label;
      setStatus("That sounds like a ");
      status.append(element("strong", "fc-answer", best));

      bars.replaceChildren(...probabilities.flatMap(({ label, p }) => {
        const bar = element("div", "fc-bar");
        bar.append(element("span"));
        bar.firstChild.style.width = p * 100 + "%";
        return [element("span", "", label), bar, element("span", "fc-pct", Math.round(p * 100) + "%")];
      }));
      bars.hidden = false;
      highlight(best, regions[best]);
    }

    function originalUrl(src) {
      const cdn = /^https?:\/\/i\d\.wp\.com\/([^?#]+)/.exec(src);
      return cdn ? "https://" + cdn[1] : src;
    }

    try {
      const model = await loadModel(originalUrl(img.getAttribute("src")));
      const classify = makeClassifier(model);

      function onSubmit(event) {
        event.preventDefault();
        showResult(classify(input.value), model.regions);
      }
      form.addEventListener("submit", onSubmit);
      input.addEventListener("keydown", event => { if (event.key === "Enter") onSubmit(event); });

      input.disabled = button.disabled = false;
      setStatus(`Model loaded: I know ${model.classes.join(", ")}.`);
    } catch (error) {
      setStatus(error.message, true);
    }
  })();
  </script>
</div>
